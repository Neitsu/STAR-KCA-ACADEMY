<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Star KCA Academy</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0a0d15;
      --panel: #121a2b;
      --panel2: #1a2440;
      --text: #eef3ff;
      --muted: #9aa6c2;
      --line: #2d3d60;
      --accent: #8b5cf6;
      --accent2: #ec4899;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #1f2d4e 0%, #0d1425 45%, #070a12 100%);
    }
    .container { width: min(1160px, 92vw); margin: 0 auto; }
    header {
      position: sticky; top: 0; z-index: 30;
      backdrop-filter: blur(8px);
      background: rgba(10, 13, 21, .9);
      border-bottom: 1px solid var(--line);
    }
    .topbar { min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: .7rem; flex-wrap: wrap; padding: .8rem 0; }
    .brand h1 { margin: 0; font-size: 1.02rem; text-transform: uppercase; letter-spacing: .08em; }
    .brand p { margin: .2rem 0 0; color: var(--muted); font-size: .8rem; }
    
    .nav-wrapper { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    nav { display: flex; gap: .5rem; flex-wrap: wrap; }
    .nav-link {
      text-decoration: none; color: var(--text); background: var(--panel);
      border: 1px solid var(--line); border-radius: 999px; padding: .42rem .74rem; font-size: .84rem;
      transition: all 0.2s ease;
    }
    .nav-link:hover { filter: brightness(1.1); }
    .nav-link.active { background: linear-gradient(120deg, var(--accent), var(--accent2)); border-color: transparent; }
    
    .lang-select {
      background: var(--panel2); color: var(--text); border: 1px solid var(--line);
      border-radius: 8px; padding: .35rem .5rem; font-size: .8rem; cursor: pointer; outline: none;
    }

    main { padding: 1rem 0 2.6rem; }
    
    @keyframes fadeInSlide { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .page { display: none; }
    .page.active { display: block; animation: fadeInSlide 0.35s ease forwards; }

    .card {
      background: linear-gradient(180deg, #19243d 0%, #111827 100%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1rem;
    }
    h2, h3 { margin: .2rem 0 .85rem; }
    .small { color: var(--muted); font-size: .82rem; }
    .filters { display: flex; flex-wrap: wrap; gap: .55rem; margin-bottom: .85rem; }
    input, select {
      border-radius: 10px; border: 1px solid var(--line); outline: none;
      background: #0d1527; color: var(--text); padding: .52rem .7rem; transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: var(--accent); }
    
    .contestants-grid { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); }
    .contestant-card {
      border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; background: #0d1526;
      transition: transform .15s ease, border-color .15s ease;
    }
    .contestant-card:hover { transform: translateY(-3px); border-color: rgba(139,92,246,.5); }
    .contestant-card img { width: 100%; height: 165px; object-fit: cover; display: block; }
    .contestant-card.eliminated-card { opacity: .75; border-color: rgba(148,163,184,.3); }
    .contestant-card.eliminated-card img { filter: grayscale(100%) contrast(.85); }
    .pill { display: inline-block; margin-top: .32rem; padding: .16rem .52rem; border-radius: 999px; font-size: .72rem; border: 1px solid transparent; }
    .safe { background: rgba(34,197,94,.16); border-color: rgba(34,197,94,.45); }
    .nominee { background: rgba(245,158,11,.16); border-color: rgba(245,158,11,.42); }
    .saved_judges, .saved_public { background: rgba(59,130,246,.16); border-color: rgba(59,130,246,.42); }
    .eliminated { background: rgba(239,68,68,.16); border-color: rgba(239,68,68,.42); }
    .tbd { background: rgba(148,163,184,.16); border-color: rgba(148,163,184,.42); }
    
    .row { display: grid; grid-template-columns: 1fr; gap: 1rem; }
    @media (min-width: 840px) { .row.two { grid-template-columns: 280px 1fr; } }
    .profile-img { width: 100%; max-width: 260px; border-radius: 12px; border: 1px solid var(--line); }
    .btn { text-decoration: none; color: var(--text); border: 1px solid var(--line); background: var(--panel2); border-radius: 10px; padding: .42rem .7rem; display: inline-block; cursor: pointer; transition: filter 0.2s; }
    .btn:hover { filter: brightness(1.2); }
    .profile-nav { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin-bottom: .5rem; }
    
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: .5rem; }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    th, td { border-bottom: 1px solid var(--line); padding: .5rem .36rem; text-align: left; white-space: nowrap; }
    .table-wrap a { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
    .table-wrap a:visited { color: var(--text); }
    
    .chip { display: inline-block; border: 1px solid var(--line); border-radius: 999px; padding: .18rem .52rem; font-size: .74rem; background: rgba(99,102,241,.12); }
    .vote-row { margin-bottom: .72rem; }
    .bar { width: 100%; height: 12px; border: 1px solid var(--line); background: #091224; border-radius: 999px; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.5s ease; }
    
    .highlight-grid { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-top: .8rem; }
    .highlight-item { background: #0d1526; border: 1px solid var(--line); border-radius: 12px; padding: 1rem; transition: transform .15s ease, border-color .15s ease; }
    .highlight-item:hover { transform: translateY(-3px); border-color: rgba(139,92,246,.5); }
    .highlight-item h4 { margin: 0 0 .5rem; font-size: .75rem; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }
    .highlight-item p { margin: 0; font-size: 1.05rem; font-weight: 600; color: var(--text); }
    .highlight-item .desc { display: block; font-size: .8rem; color: var(--muted); font-weight: normal; margin-top: .35rem; line-height: 1.4; }

    @media (max-width: 680px) {
      th, td { font-size: .78rem; padding: .45rem .3rem; }
      .brand h1 { font-size: .95rem; }
      .brand p { font-size: .72rem; }
      .nav-link { font-size: .76rem; padding: .35rem .6rem; }
      .filters { flex-direction: column; align-items: stretch; gap: .45rem; }
      input, select { width: 100%; font-size: .84rem; }
      .card { padding: .75rem; border-radius: 10px; }
      h2 { font-size: 1.2rem; }
      h3 { font-size: 1.05rem; }
      .profile-img { max-width: 100%; margin: 0 auto; display: block; }
    }
  </style>
</head>

    </div>
    <div class="nav-wrapper">
      <nav id="nav"></nav>

function normId(v) { return String(v || "").toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, ''); }
function canonicalRoundId(value) {
  const raw = String(value || '').trim().toUpperCase().replace(/\s+/g, '_').replace(/-/g, '_');
  if (!raw) return ''; if (ROUND_ORDER.includes(raw)) return raw;
  if (/^R[1-6]$/.test(raw)) return `ROUND_${raw.slice(1)}`;
  if (raw === 'PRE_RANK' || raw === 'PRERANKING') return 'PRERANK';
  if (raw === 'ROUND1') return 'ROUND_1'; if (raw === 'ROUND2') return 'ROUND_2';
  if (raw === 'ROUND3') return 'ROUND_3'; if (raw === 'ROUND4') return 'ROUND_4'; if (raw === 'ROUND5') return 'ROUND_5';
  return raw;
}
function normalizeJudgeName(v) { return String(v || '').trim().toLowerCase(); }
function prettyFromId(id) { return PRETTY[id] || String(id || '').replace(/_/g, ' ').replace(/\b\w/g, m => m.toUpperCase()); }
function getContestantName(id) {
  const raw = state.data.contestants.find(c => c.id === id)?.name || '';
  return String(raw || '').trim() || prettyFromId(id);
}
function isPlaceholderContestantId(id) {
  const key = String(id || '').trim().toLowerCase();
  return key === 'n_a' || key === 'na' || key === 'n' || key === 'none' || key === 'null' || key === 'undefined' || key === 'unknown';
}
function isPlaceholderContestantName(name) {
  const normalized = String(name || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
  return normalized === 'na' || normalized === 'none' || normalized === 'null' || normalized === 'undefined' || normalized === 'unknown';
}
function colorForIndex(i) {
  const hue = (i * 47) % 360; return `hsl(${hue} 85% 62%)`;
}
function handleImageFallback(img) {
  const step = Number(img.dataset.fallbackStep || '0');
  const contestantId = String(img.dataset.contestantId || '').trim();
  const canonicalLocal = contestantId ? `assets/${contestantId}.jpg` : '';
  const currentSrc = String(img.getAttribute('src') || '');
  if (step === 0 && canonicalLocal && !currentSrc.endsWith(canonicalLocal)) { img.dataset.fallbackStep = '1'; img.src = canonicalLocal; return; }
  img.onerror = null; img.src = 'assets/placeholder.jpg';
}

async function fetchSheetTab(sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(sheetName)}&tqx=out:json`;
  const txt = await fetch(url).then(r => r.text());
  const m = txt.match(/google\.visualization\.Query\.setResponse\((.*)\);/s);
  if (!m) throw new Error(`Invalid gviz payload for ${sheetName}`);
  const json = JSON.parse(m[1]);
  const cols = json.table.cols.map(c => c.label || c.id || '');
  return json.table.rows.map(r => Object.fromEntries(cols.map((c, i) => [c, r.c[i]?.v ?? ''])));
}

async function fetchOptionalSheetTab(sheetName) { try { return await fetchSheetTab(sheetName); } catch { return []; } }
function keyNorm(k) { return String(k || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
function pickValue(row, aliases) {
  const keys = Object.keys(row);
  for (const a of aliases) {
    const n = keyNorm(a); const real = keys.find(k => keyNorm(k) === n);
    if (real != null) return row[real];
  }
  return '';
}

async function loadDataFromRoundTabs() {
  const rowsByRound = {};
  for (const [rid, tab] of Object.entries(CONFIG.ROUND_TABS)) { rowsByRound[rid] = await fetchOptionalSheetTab(tab); }
  const contestantsMap = new Map();
  const judge_rankings = []; const scores = []; const submissions = [];

  Object.entries(rowsByRound).forEach(([round_id, rows]) => {
    rows.forEach((row) => {
      const name = String(pickValue(row, ['name', 'contestant', 'candidate']) || '').trim(); if (!name) return;
      const id = normId(name);
      const instagram = String(pickValue(row, ['instagram', 'instagram_handle', 'username']) || '').trim();
      const performance = String(pickValue(row, ['performance', 'song', 'song_title']) || '').trim();
      const link = String(pickValue(row, ['link', 'performance_link', 'youtube_url', 'url']) || '').trim();
      const officialRank = Number(pickValue(row, ['official_rank', 'rank', 'official ranking']));
      const perfScore = Number(pickValue(row, ['performance_score', 'score', 'creator_score', 'total']));

      if (!contestantsMap.has(id)) contestantsMap.set(id, { id, name, photo_url: `assets/${id}.jpg`, country: '', bio: '', instagram, pronouns: '' });
      if (instagram && !contestantsMap.get(id).instagram) contestantsMap.get(id).instagram = instagram;
      if (Number.isFinite(officialRank)) judge_rankings.push({ round_id, judge_name: 'official', contestant_id: id, rank: officialRank });
      if (Number.isFinite(perfScore)) scores.push({ round_id, contestant_id: id, total: perfScore });
      if (performance || link) submissions.push({ round_id, contestant_id: id, song_title: performance, group_song: '', bandlab_url: '', youtube_url: link, notes: '' });

      JUDGE_NAMES.forEach(jn => {
        const val = Number(pickValue(row, [jn, `${jn}_rank`, `${jn} rank`]));
        if (Number.isFinite(val)) judge_rankings.push({ round_id, judge_name: jn, contestant_id: id, rank: val });
      });
    });
  });
  return { contestants: [...contestantsMap.values()], rounds: [], submissions, scores, judge_rankings, round_status: [], votes_live: [] };
}

async function loadData() {
  const standard = {
    contestants: await fetchOptionalSheetTab(CONFIG.SHEETS.contestants), rounds: await fetchOptionalSheetTab(CONFIG.SHEETS.rounds),
    submissions: await fetchOptionalSheetTab(CONFIG.SHEETS.submissions), scores: await fetchOptionalSheetTab(CONFIG.SHEETS.scores),
    judge_rankings: await fetchOptionalSheetTab(CONFIG.SHEETS.judge_rankings), round_status: await fetchOptionalSheetTab(CONFIG.SHEETS.round_status),
    votes_live: await fetchOptionalSheetTab(CONFIG.SHEETS.votes_live)
  };
  const hasStandard = [standard.contestants, standard.scores, standard.judge_rankings, standard.round_status, standard.submissions].some(a => a.length);
  if (hasStandard) { state.data = standard; } else { state.data = await loadDataFromRoundTabs(); state.data.votes_live = await fetchOptionalSheetTab(CONFIG.SHEETS.votes_live); }
}

function normalizeData() {
  const d = state.data;
  d.contestants = Array.isArray(d.contestants) ? d.contestants : []; d.rounds = Array.isArray(d.rounds) ? d.rounds : [];
  d.submissions = Array.isArray(d.submissions) ? d.submissions : []; d.scores = Array.isArray(d.scores) ? d.scores : [];
  d.judge_rankings = Array.isArray(d.judge_rankings) ? d.judge_rankings : []; d.round_status = Array.isArray(d.round_status) ? d.round_status : [];
  d.votes_live = Array.isArray(d.votes_live) ? d.votes_live : [];

  d.contestants = d.contestants.map(r => ({
    id: normId(r.id || r.contestant_id || r.name), name: String(r.name || '').trim() || prettyFromId(normId(r.id || r.contestant_id || r.name)),
    photo_url: String(r.photo_url || `assets/${normId(r.id || r.name)}.jpg`), country: String(r.country || '').trim(),
    bio: String(r.bio || '').trim(), instagram: String(r.instagram || '').trim(), pronouns: String(r.pronouns || '').trim()
  })).filter(c => c.id && !isPlaceholderContestantId(c.id) && !isPlaceholderContestantName(c.name));

  const contestantsById = new Map();
  d.contestants.forEach((c) => {
    if (!contestantsById.has(c.id)) { contestantsById.set(c.id, c); return; }
    const existing = contestantsById.get(c.id);
    contestantsById.set(c.id, { ...existing, name: existing.name || c.name, photo_url: existing.photo_url || c.photo_url, country: existing.country || c.country, bio: existing.bio || c.bio, instagram: existing.instagram || c.instagram, pronouns: existing.pronouns || c.pronouns });
  });
  d.contestants = [...contestantsById.values()];

  d.submissions = d.submissions.map(r => ({ ...r, round_id: canonicalRoundId(r.round_id), contestant_id: normId(r.contestant_id) })).filter(r => r.contestant_id && !isPlaceholderContestantId(r.contestant_id));
  const submissionsByRoundContestant = new Map();
  d.submissions.forEach((s) => {
    const key = `${s.round_id}::${s.contestant_id}`;
    if (!submissionsByRoundContestant.has(key)) { submissionsByRoundContestant.set(key, s); return; }
    const existing = submissionsByRoundContestant.get(key);
    const existingScore = [existing.song_title, existing.group_song, existing.youtube_url, existing.bandlab_url].filter(v => String(v || '').trim()).length;
    const candidateScore = [s.song_title, s.group_song, s.youtube_url, s.bandlab_url].filter(v => String(v || '').trim()).length;
    if (candidateScore > existingScore) { submissionsByRoundContestant.set(key, { ...existing, ...s }); return; }
    submissionsByRoundContestant.set(key, { ...existing, song_title: existing.song_title || s.song_title, group_song: existing.group_song || s.group_song, youtube_url: existing.youtube_url || s.youtube_url, bandlab_url: existing.bandlab_url || s.bandlab_url, notes: existing.notes || s.notes });
  });
  d.submissions = [...submissionsByRoundContestant.values()];

  d.scores = d.scores.map(r => ({ ...r, round_id: canonicalRoundId(r.round_id), contestant_id: normId(r.contestant_id), total: Number(r.total) })).filter(r => r.contestant_id && !isPlaceholderContestantId(r.contestant_id));
  d.judge_rankings = d.judge_rankings.map(r => ({ ...r, round_id: canonicalRoundId(r.round_id), contestant_id: normId(r.contestant_id), rank: Number(r.rank), judge_name: String(r.judge_name || '').trim() })).filter(r => r.contestant_id && !isPlaceholderContestantId(r.contestant_id));
  d.round_status = d.round_status.map(r => ({ ...r, round_id: canonicalRoundId(r.round_id), contestant_id: normId(r.contestant_id), status: String(r.status || '').trim().toLowerCase() })).filter(r => r.contestant_id && !isPlaceholderContestantId(r.contestant_id));
  d.votes_live = d.votes_live.map(r => ({ ...r, round_id: canonicalRoundId(r.round_id), contestant_id: normId(r.contestant_id), votes_count: Number(r.votes_count || 0) })).filter(r => r.contestant_id && !isPlaceholderContestantId(r.contestant_id));
}

function resolveContestantIdByName(name) {
  const slug = normId(name); const byId = state.data.contestants.find(c => c.id === slug); if (byId) return byId.id;
  const normalized = String(name || '').toLowerCase().replace(/\s+/g, ' ').trim();
  const byName = state.data.contestants.find(c => String(c.name || '').toLowerCase().replace(/\s+/g, ' ').trim() === normalized);
  if (byName) return byName.id; return slug;
}

// 🔥 NOUVELLE LOGIQUE : GESTION INTELLIGENTE DES ÉLIMINÉS
function applyAllManualRounds() {
  const roundsToProcess = ['ROUND_1', 'ROUND_2', 'ROUND_3', 'ROUND_4', 'ROUND_5'];
  
  roundsToProcess.forEach(roundId => {
    const results = MANUAL_ROUNDS_DATA[roundId];
    if (!results) return;

    const idsInResults = new Set(results.map(r => resolveContestantIdByName(r.name)));
    
    state.data.judge_rankings = state.data.judge_rankings.filter(r => r.round_id !== roundId);
    state.data.scores = state.data.scores.filter(r => r.round_id !== roundId);
    state.data.round_status = state.data.round_status.filter(r => r.round_id !== roundId);
    
    if (roundId !== 'ROUND_1') {
      state.data.submissions = state.data.submissions.filter(r => r.round_id !== roundId);
    }

    results.forEach((row) => {
      const contestantId = resolveContestantIdByName(row.name); 
      if (!contestantId) return;

      if (Number.isFinite(row.official)) state.data.judge_rankings.push({ round_id: roundId, judge_name: 'official', contestant_id: contestantId, rank: row.official });
      if (Number.isFinite(row.neitsu)) state.data.judge_rankings.push({ round_id: roundId, judge_name: 'Neitsu', contestant_id: contestantId, rank: row.neitsu });
      if (Number.isFinite(row.hauras)) state.data.judge_rankings.push({ round_id: roundId, judge_name: 'Hauras', contestant_id: contestantId, rank: row.hauras });
      if (Number.isFinite(row.kaina)) state.data.judge_rankings.push({ round_id: roundId, judge_name: 'Kaina', contestant_id: contestantId, rank: row.kaina });
      if (Number.isFinite(row.bibiblu)) state.data.judge_rankings.push({ round_id: roundId, judge_name: 'Bibiblu', contestant_id: contestantId, rank: row.bibiblu });
      if (Number.isFinite(row.aya)) state.data.judge_rankings.push({ round_id: roundId, judge_name: 'Aya', contestant_id: contestantId, rank: row.aya });
      
      if (Number.isFinite(row.score)) state.data.scores.push({ round_id: roundId, contestant_id: contestantId, total: row.score });
      if (row.status) state.data.round_status.push({ round_id: roundId, contestant_id: contestantId, status: row.status });
      
      if (roundId !== 'ROUND_1' && (row.performance || row.link)) { 
        state.data.submissions.push({ round_id: roundId, contestant_id: contestantId, song_title: row.performance || '', group_song: row.performance || '', bandlab_url: '', youtube_url: row.link || '', notes: '' }); 
      }
    });

    const allIds = state.data.contestants.map(c => c.id).filter(Boolean);
    allIds.forEach((id) => { 
      if (!idsInResults.has(id) && !state.data.round_status.some(r => r.round_id === roundId && r.contestant_id === id)) { 
        
        // On vérifie le statut du candidat dans les rounds précédents
        const priorStatuses = state.data.round_status.filter(r => r.contestant_id === id);
        let isEliminated = false;
        
        if (priorStatuses.length > 0) {
          const lastStatus = priorStatuses[priorStatuses.length - 1].status;
          if (lastStatus === 'eliminated') {
            isEliminated = true; // Il a déjà été éliminé avant !
          }
        }
        
        // S'il était éliminé, il reste éliminé. Sinon on le met safe.
        state.data.round_status.push({ round_id: roundId, contestant_id: id, status: isEliminated ? 'eliminated' : 'safe' }); 
      } 
    });
  });
}

function applyManualPrerankSeed() {
  const hasOfficialPrerank = state.data.judge_rankings.some(r => r.round_id === 'PRERANK' && normalizeJudgeName(r.judge_name) === 'official');
  const hasScorePrerank = state.data.scores.some(r => r.round_id === 'PRERANK' && Number.isFinite(Number(r.total)));
  PRERANK_MANUAL_ROWS.forEach((row) => {
    const id = resolveContestantIdByName(row.name);
    let c = state.data.contestants.find(x => x.id === id);
    if (!c) { c = { id, name: row.name, photo_url: `assets/${id}.jpg`, country: '', bio: '', instagram: '', pronouns: '' }; state.data.contestants.push(c); }
    if (!c.instagram && row.instagram) c.instagram = row.instagram;
    if (!hasOfficialPrerank) state.data.judge_rankings.push({ round_id: 'PRERANK', judge_name: 'official', contestant_id: id, rank: row.official_rank });
    if (!hasScorePrerank) state.data.scores.push({ round_id: 'PRERANK', contestant_id: id, total: row.score });
  });
}

function applyManualR1Seed() {
  const hasR1Submissions = state.data.submissions.some(r => r.round_id === 'ROUND_1' && (String(r.song_title || '').trim() || String(r.youtube_url || '').trim() || String(r.bandlab_url || '').trim()));
  if (!hasR1Submissions) { state.data.submissions = state.data.submissions.filter(r => r.round_id !== 'ROUND_1'); }
  R1_MANUAL_ROWS.forEach((row) => {
    const id = resolveContestantIdByName(row.name);
    let c = state.data.contestants.find(x => x.id === id);
    if (!c) { c = { id, name: row.name, photo_url: `assets/${id}.jpg`, country: '', bio: '', instagram: '', pronouns: '' }; state.data.contestants.push(c); }
    if (!c.instagram && row.instagram) c.instagram = row.instagram;
    if (!hasR1Submissions && (row.performance || row.link)) { state.data.submissions.push({ round_id: 'ROUND_1', contestant_id: id, song_title: row.performance || '', group_song: '', bandlab_url: '', youtube_url: row.link || '', notes: '' }); }
  });
}

function enforcePrerankSafeStatus() {
  const ids = state.data.contestants.length ? state.data.contestants.map(c => c.id).filter(Boolean) : [...CANDIDATE_NAMES];
  state.data.round_status = state.data.round_status.filter(r => r.round_id !== 'PRERANK');
  ids.forEach(id => state.data.round_status.push({ round_id: 'PRERANK', contestant_id: id, status: 'safe' }));
}

function getStatus(roundId, contestantId) { return state.data.round_status.find(r => r.round_id === roundId && r.contestant_id === contestantId)?.status || ''; }
function getFirstEliminatedRoundIndex(contestantId) { return ROUND_ORDER.findIndex(round => getStatus(round, contestantId) === 'eliminated'); }

function applyFixedEliminatedSortRanks(rankingByRound) {
  Object.entries(FIXED_ELIMINATED_RANKS).forEach(([contestantId, rank]) => {
    const eliminatedAt = getFirstEliminatedRoundIndex(contestantId);
    if (eliminatedAt < 0) return;
    ROUND_ORDER.slice(eliminatedAt).forEach((round) => {
      const roundHasData = state.data.round_status.some(r => r.round_id === round) || state.data.judge_rankings.some(r => r.round_id === round) || state.data.scores.some(r => r.round_id === round);
      if (roundHasData) rankingByRound[round][contestantId] = rank;
    });
  });
}
function statusClass(status) { return status || 'tbd'; }
function statusLabel(status) { return status ? t(status) : t('tbd'); }

function getOfficialRankingByRound() {
  const out = Object.fromEntries(ROUND_ORDER.map(r => [r, {}]));
  state.data.judge_rankings.filter(r => normalizeJudgeName(r.judge_name) === 'official').forEach(r => { if (Number.isFinite(r.rank)) out[r.round_id][r.contestant_id] = r.rank; });
  ROUND_ORDER.forEach(round => {
    if (Object.keys(out[round]).length) return;
    const list = state.data.scores.filter(s => s.round_id === round && Number.isFinite(s.total)).sort((a, b) => b.total - a.total);
    list.forEach((s, i) => out[round][s.contestant_id] = i + 1);
  });
  return out;
}

function getContestantDisplayRankingByRound() {
  const out = getOfficialRankingByRound(); applyFixedEliminatedSortRanks(out); return out;
}

function getJudgeRankingByRound(judgeName) {
  const key = normalizeJudgeName(judgeName);
  const out = Object.fromEntries(ROUND_ORDER.map(r => [r, {}]));
  state.data.judge_rankings.filter(r => normalizeJudgeName(r.judge_name) === key).forEach(r => { if (Number.isFinite(r.rank)) out[r.round_id][r.contestant_id] = r.rank; });
  return out;
}

function getPerformanceScoreByRound() {
  const out = Object.fromEntries(ROUND_ORDER.map(r => [r, {}]));
  state.data.scores.forEach(s => { if (Number.isFinite(s.total)) out[s.round_id][s.contestant_id] = s.total; });
  return out;
}

function getRankingViewOptions() {
  return [
    { value: 'official', label: t('official_rank') },
    ...JUDGE_NAMES.map(j => ({ value: `judge:${j}`, label: j })),
    { value: 'performance_score', label: t('perf_score') }
  ];
}

function getRankingMapByView(view) {
  if (view === 'official') return getOfficialRankingByRound();
  if (view === 'performance_score') return getPerformanceScoreByRound();
  if (view.startsWith('judge:')) return getJudgeRankingByRound(view.split(':')[1]);
  return getOfficialRankingByRound();
}

function getLatestRound(officialByRound) {
  for (let i = ROUND_ORDER.length - 1; i >= 0; i--) {
    const round = ROUND_ORDER[i];
    const hasOfficial = Object.keys(officialByRound[round] || {}).length > 0;
    const hasStatus = state.data.round_status.some(r => r.round_id === round);
    if (hasOfficial || hasStatus) return round;
  }
  return 'PRERANK';
}

function sortedContestants() {
  const displayByRound = getContestantDisplayRankingByRound();
  const current = displayByRound[state.latestRound] || {};
  return [...state.data.contestants].sort((a, b) => {
    const aStatus = getStatus(state.latestRound, a.id);
    const bStatus = getStatus(state.latestRound, b.id);
    const aElim = aStatus === 'eliminated' ? 1 : 0;
    const bElim = bStatus === 'eliminated' ? 1 : 0;
    if (aElim !== bElim) return aElim - bElim;
    const ar = current[a.id], br = current[b.id];
    if (Number.isFinite(ar) && Number.isFinite(br)) return ar - br;
    if (Number.isFinite(ar)) return -1;
    if (Number.isFinite(br)) return 1;
    return String(a.name || '').localeCompare(String(b.name || ''));
  });
}

function renderContestants() {
  const root = document.getElementById('contestants');
  const officialByRound = getOfficialRankingByRound();
  const currentRanks = officialByRound[state.latestRound] || {};
  root.innerHTML = `
    <div class="card">
      <h2>${t('nav_contestants')}</h2>
      <p class="small">${t('auto_updated')} <span class="chip">${getRoundLabel(state.latestRound)}</span></p>
      <div class="filters">
        <input id="searchContestant" placeholder="${t('search_ph')}" />
        <select id="statusFilter">
          <option value="all">${t('all_status')}</option>
          <option value="safe">${t('safe')}</option>
          <option value="nominee">${t('nominee')}</option>
          <option value="saved_judges">${t('saved_judges')}</option>
          <option value="saved_public">${t('saved_public')}</option>
          <option value="eliminated">${t('eliminated')}</option>
          <option value="tbd">${t('tbd')}</option>
        </select>
      </div>
      <div id="contestantsGrid" class="contestants-grid"></div>
    </div>`;

  const draw = () => {
    const q = document.getElementById('searchContestant').value.toLowerCase().trim();
    const f = document.getElementById('statusFilter').value;
    const list = sortedContestants().filter(c => c.name.toLowerCase().includes(q)).filter(c => {
      const status = getStatus(state.latestRound, c.id);
      if (f === 'all') return true;
      if (f === 'tbd') return !status;
      return status === f;
    });
    document.getElementById('contestantsGrid').innerHTML = list.map(c => {
      const status = getStatus(state.latestRound, c.id);
      return `<article class="contestant-card ${status === 'eliminated' ? 'eliminated-card' : ''}" onclick="location.hash='#profile/${c.id}'">
        <img src="${c.photo_url}" loading="lazy" data-contestant-id="${c.id}" alt="${c.name}" onerror="handleImageFallback(this)" />
        <div class="body"><strong>${getContestantName(c.id)}</strong><div class="small">${Number.isFinite(currentRanks[c.id]) ? `${t('rank')} ${getRoundLabel(state.latestRound)}: #${currentRanks[c.id]}` : `${t('rank')} ${getRoundLabel(state.latestRound)}: —`}</div><span class="pill ${statusClass(status)}">${statusLabel(status)}</span></div>
      </article>`;
    }).join('') || `<p class="small">${t('no_contestants')}</p>`;
  };
  document.getElementById('searchContestant').addEventListener('input', draw);
  document.getElementById('statusFilter').addEventListener('change', draw);
  draw();
}

function renderHighlightsBlock(roundId) {
  const h = ROUND_HIGHLIGHTS[roundId];
  if (!h) return '';
  const items = [];
  if (h.top3) items.push(`<div class="highlight-item"><h4>${t('hl_top3')}</h4><p>${h.top3.val}<span class="desc">${t(h.top3.descKey)}</span></p></div>`);
  if (h.rise) items.push(`<div class="highlight-item"><h4>${t('hl_rise')}</h4><p>${h.rise.val}<span class="desc">${t(h.rise.descKey)}</span></p></div>`);
  if (h.danger) items.push(`<div class="highlight-item"><h4>${t('hl_danger')}</h4><p>${h.danger.val}<span class="desc">${t(h.danger.descKey)}</span></p></div>`);
  if (h.jury) items.push(`<div class="highlight-item"><h4>${t('hl_jury')}</h4><p>${h.jury.val}<span class="desc">${t(h.jury.descKey)}</span></p></div>`);
  if (h.public) items.push(`<div class="highlight-item"><h4>${t('hl_public')}</h4><p>${h.public.val}<span class="desc">${t(h.public.descKey)}</span></p></div>`);

function renderRankings() {
  const root = document.getElementById('rankings');
  const viewOptions = getRankingViewOptions();
  const rankingMap = getRankingMapByView(state.rankingView);
  const isPerformance = state.rankingView === 'performance_score';
  const officialByRound = getOfficialRankingByRound();
  
  const activeRound = state.selectedRankingsRound || state.latestRound;
  const activeRoundIndex = Math.max(0, ROUND_ORDER.indexOf(activeRound));
  
  const getLatestOfficialRank = (contestantId) => {
    for (let i = activeRoundIndex; i >= 0; i--) { const rank = officialByRound[ROUND_ORDER[i]]?.[contestantId]; if (Number.isFinite(rank)) return rank; }
    return null;
  };
  
  const list = [...state.data.contestants].sort((a, b) => {
    const aEliminated = getStatus(activeRound, a.id) === 'eliminated';
    const bEliminated = getStatus(activeRound, b.id) === 'eliminated';
    if (aEliminated !== bEliminated) return aEliminated ? 1 : -1;
    if (aEliminated && bEliminated) {
      const ar = FIXED_ELIMINATED_RANKS[a.id]; const br = FIXED_ELIMINATED_RANKS[b.id];
      if (Number.isFinite(ar) && Number.isFinite(br)) return ar - br;
      if (Number.isFinite(ar)) return -1; if (Number.isFinite(br)) return 1;
      return a.name.localeCompare(b.name);
    }
    const va = rankingMap[activeRound]?.[a.id]; const vb = rankingMap[activeRound]?.[b.id];
    if (Number.isFinite(va) && Number.isFinite(vb)) { return isPerformance ? vb - va : va - vb; }
    if (Number.isFinite(va)) return -1; if (Number.isFinite(vb)) return 1;
    const ar = getLatestOfficialRank(a.id); const br = getLatestOfficialRank(b.id);
    if (Number.isFinite(ar) && Number.isFinite(br)) return ar - br;
    if (Number.isFinite(ar)) return -1; if (Number.isFinite(br)) return 1;
    return a.name.localeCompare(b.name);
  });

  const nominations = {
    nominee: state.data.round_status.filter(r => r.round_id === activeRound && r.status === 'nominee'),
    saved_judges: state.data.round_status.filter(r => r.round_id === activeRound && r.status === 'saved_judges'),
    saved_public: state.data.round_status.filter(r => r.round_id === activeRound && r.status === 'saved_public'),
    eliminated: state.data.round_status.filter(r => r.round_id === activeRound && r.status === 'eliminated')
  };

  root.innerHTML = `
    <div class="card">
      <h2>${t('nav_rankings')}</h2>
      <div class="filters">
        <select id="rankingViewSelect">${viewOptions.map(o => `<option value="${o.value}" ${o.value===state.rankingView?'selected':''}>${o.label}</option>`).join('')}</select>
        <select id="rankingsRoundSelect">
          ${ROUND_ORDER.slice(0, ROUND_ORDER.indexOf(state.latestRound) + 1).map(r => `<option value="${r}" ${r === activeRound ? 'selected' : ''}>${getRoundLabel(r)}</option>`).join('')}
        </select>
      </div>
      <p class="small">${t('rankings_desc')}</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>${isPerformance ? t('pos') : t('rank')}</th><th>${t('name')}</th>${ROUND_ORDER.map(r => `<th>${getRoundLabel(r)}</th>`).join('')}</tr>
          </thead>
          <tbody>
            ${list.map((c, idx) => `<tr><td>${idx + 1}</td><td><a href="#profile/${c.id}">${getContestantName(c.id)}</a></td>
                ${ROUND_ORDER.map(r => { const v = rankingMap[r]?.[c.id]; if (!Number.isFinite(v)) return '<td>—</td>'; return `<td>${isPerformance ? v.toFixed(1).replace(/\.0$/, '') : v}</td>`; }).join('')}
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <h3>${t('nominations')} (${getRoundLabel(activeRound)})</h3>
      <p class="small">${t('nominee_lbl')}: ${nominations.nominee.map(x => getContestantName(x.contestant_id)).join(', ') || '—'}</p>
      <p class="small">${t('saved_judges_lbl')}: ${nominations.saved_judges.map(x => getContestantName(x.contestant_id)).join(', ') || '—'}</p>
      <p class="small">${t('saved_public_lbl')}: ${nominations.saved_public.map(x => getContestantName(x.contestant_id)).join(', ') || '—'}</p>
      <p class="small">${t('eliminated_lbl')}: ${nominations.eliminated.map(x => getContestantName(x.contestant_id)).join(', ') || '—'}</p>
    </div>
    ${renderHighlightsBlock(activeRound)}
    <div class="card">
      <h3>${t('global_chart')}</h3>
      <canvas id="rankingChart" height="120"></canvas>
    </div>`;

  document.getElementById('rankingViewSelect').addEventListener('change', (e) => { state.rankingView = e.target.value; renderRankings(); });
  document.getElementById('rankingsRoundSelect').addEventListener('change', (e) => { state.selectedRankingsRound = e.target.value; renderRankings(); });

  if (rankingChart) rankingChart.destroy();
  const ctx = document.getElementById('rankingChart');
  
  rankingChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: ROUND_ORDER.map(r => getRoundLabel(r)),
      datasets: state.data.contestants.map((c, idx) => {
        const isEliminated = getStatus(activeRound, c.id) === 'eliminated';
        const baseColor = colorForIndex(idx);
        const color = isEliminated ? baseColor.replace('hsl', 'hsla').replace(')', ', 0.35)') : baseColor;
        
        return { 
          label: getContestantName(c.id), 
          data: ROUND_ORDER.map(r => { const v = rankingMap[r]?.[c.id]; return Number.isFinite(v) ? v : null; }), 
          borderColor: color, backgroundColor: color, 
          borderWidth: isEliminated ? 1 : 2, borderDash: isEliminated ? [5, 5] : [], 
          pointRadius: isEliminated ? 0 : 2, pointHoverRadius: 5, tension: .25, spanGaps: true, order: isEliminated ? 2 : 1 
        };
      })
    },
    options: {
      interaction: { mode: 'dataset', intersect: true },
      onHover: (e, elements, chart) => {
        if (elements && elements.length) {
          const hoveredIdx = elements[0].datasetIndex;
          chart.data.datasets.forEach((ds, i) => {
            const isHovered = i === hoveredIdx;
            const isElim = getStatus(activeRound, state.data.contestants[i].id) === 'eliminated';
            ds.borderColor = isHovered ? colorForIndex(i) : 'rgba(154, 166, 194, 0.1)';
            ds.borderWidth = isHovered ? 4 : (isElim ? 1 : 2);
            ds.order = isHovered ? 0 : 1;
          });
          chart.update('none');
        } else {
          chart.data.datasets.forEach((ds, i) => {
            const isElim = getStatus(activeRound, state.data.contestants[i].id) === 'eliminated';
            const baseCol = colorForIndex(i);
            ds.borderColor = isElim ? baseCol.replace('hsl', 'hsla').replace(')', ', 0.35)') : baseCol;
            ds.borderWidth = isElim ? 1 : 2;
            ds.order = isElim ? 2 : 1;
          });
          chart.update('none');
        }
      },
      plugins: { legend: { display: true, position: 'bottom', labels: { color: '#eef3ff', boxWidth: 10, usePointStyle: true, pointStyle: 'line' } } },
      scales: isPerformance ? { x: { ticks: { color: '#9aa6c2' } }, y: { ticks: { color: '#9aa6c2' }, title: { display: true, text: t('perf_score'), color: '#9aa6c2' } } }
                            : { x: { ticks: { color: '#9aa6c2' } }, y: { reverse: true, min: 1, max: Math.max(22, state.data.contestants.length), ticks: { color: '#9aa6c2', stepSize: 1 } } }
    }
  });
}

    data: {
      labels: ROUND_ORDER.map(r => getRoundLabel(r)),
      datasets: [{ label: getContestantName(c.id), data: ROUND_ORDER.map(r => official[r]?.[c.id] ?? null), borderColor: '#8b5cf6', backgroundColor: 'rgba(139,92,246,.2)', borderWidth: 2, tension: .25, spanGaps: true }]
    },
    options: { plugins: { legend: { labels: { color: '#eef3ff' } } }, scales: { x: { ticks: { color: '#9aa6c2' } }, y: { reverse: true, min: 1, max: Math.max(22, state.data.contestants.length), ticks: { color: '#9aa6c2', stepSize: 1 } } } }
  });
}

function renderVotes() {
  const root = document.getElementById('votes');
  const roundsWithVotes = ROUND_ORDER.filter(r => state.data.votes_live.some(v => v.round_id === r));
  const selected = canonicalRoundId(state.votesRound);
  state.votesRound = ROUND_ORDER.includes(selected) ? selected : (roundsWithVotes[roundsWithVotes.length - 1] || state.latestRound);

  const nominees = state.data.round_status.filter(r => r.round_id === state.votesRound && r.status === 'nominee').map(r => r.contestant_id);
  const targets = nominees.length ? nominees : [...new Set(state.data.votes_live.filter(v => v.round_id === state.votesRound).map(v => v.contestant_id))];

  const rows = targets.map(id => {
    const record = state.data.votes_live.find(v => v.round_id === state.votesRound && v.contestant_id === id);
    return { id, name: getContestantName(id), votes: Number(record?.votes_count || 0), updated: record?.last_updated || '-' };
  }).sort((a, b) => b.votes - a.votes);

  const totalVotes = rows.reduce((sum, r) => sum + r.votes, 0);

  root.innerHTML = `
    <div class="card">
      <h2>${t('nav_votes')}</h2>
      <div class="filters">
        <select id="votesRoundSelect">${ROUND_ORDER.map(r => `<option value="${r}" ${r===state.votesRound?'selected':''}>${getRoundLabel(r)}</option>`).join('')}</select>
        ${CONFIG.VOTE_FORM_URL ? `<a class="btn" target="_blank" rel="noopener noreferrer" href="${CONFIG.VOTE_FORM_URL}">${t('vote_now')}</a>` : ''}
      </div>
      ${rows.length ? rows.map(r => {
        const pct = totalVotes > 0 ? (r.votes / totalVotes) * 100 : 0;
        return `<div class="vote-row"><div><strong>${r.name}</strong> — ${r.votes} ${t('votes').toLowerCase()} (${pct.toFixed(1)}%)</div><div class="bar"><span style="width:${pct}%"></span></div></div>`;
      }).join('') : `<p>${t('no_vote_data')}</p>${roundsWithVotes.length ? `<p class="small">${t('avail_vote_rounds')} ${roundsWithVotes.map(r => getRoundLabel(r)).join(', ')}</p>` : ''}`}
      <p class="small">${t('total_votes')} ${totalVotes} · ${t('last_refresh')} ${new Date().toLocaleString(currentLang)}</p>
    </div>`;

  document.getElementById('votesRoundSelect').addEventListener('change', (e) => { state.votesRound = e.target.value; renderVotes(); });
  clearTimeout(state.votesTimer);
  state.votesTimer = setTimeout(async () => { await hydrate(); renderContestants(); renderRankings(); renderVotes(); }, CONFIG.REFRESH_MS);
}

function setupNav() {
  const nav = document.getElementById('nav');
  const tabs = [{id:'contestants', label: t('nav_contestants')}, {id:'rankings', label: t('nav_rankings')}, {id:'votes', label: t('nav_votes')}];
  nav.innerHTML = tabs.map(t => `<a class="nav-link" href="#${t.id}">${t.label}</a>`).join('');

  const onHash = () => {
    const hash = location.hash || '#contestants';
    const [page] = hash.slice(1).split('/');
    document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
    if (page === 'profile') {
      document.getElementById('profile').classList.add('active');
      renderProfile(hash.split('/')[1]);
    } else {
      const target = document.getElementById(page) ? page : 'contestants';
      document.getElementById(target).classList.add('active');
    }
    document.querySelectorAll('.nav-link').forEach(a => a.classList.toggle('active', a.getAttribute('href') === `#${page}`));
  };
  window.removeEventListener('hashchange', onHash);
  window.addEventListener('hashchange', onHash);
  onHash();
}

async function hydrate() {
  await loadData(); normalizeData(); applyManualPrerankSeed(); applyManualR1Seed(); enforcePrerankSafeStatus();
  applyAllManualRounds(); // Le moteur intelligent est réparé !
  const officialByRound = getOfficialRankingByRound();
  state.latestRound = getLatestRound(officialByRound);
  state.selectedRankingsRound = state.latestRound;
  const roundsWithVotes = ROUND_ORDER.filter(r => state.data.votes_live.some(v => v.round_id === r));
  state.votesRound = roundsWithVotes[roundsWithVotes.length - 1] || state.latestRound;
}

async function boot() {
  try {
    document.getElementById('langSelect').value = currentLang;
    document.getElementById('brandTagline').textContent = t('tagline');
    setupNav(); 
    await hydrate(); 
    renderContestants(); 
    renderRankings(); 
    renderVotes();
    if (!location.hash) location.hash = '#contestants';
  } catch (error) {
    console.error("Erreur critique au démarrage :", error);
  }
}

boot();
</script>
</body>
</html>
